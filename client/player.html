<!doctype html>
<html lang="tr" data-theme="monopoly-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Monopoly Bank</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('monopoly-theme');
        if (t === 'monopoly-light' || t === 'monopoly-dark') {
          document.documentElement.dataset.theme = t;
        }
        var l = localStorage.getItem('monopoly-lang');
        if (l) document.documentElement.lang = l;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/player.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
